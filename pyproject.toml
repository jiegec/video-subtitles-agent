[project]
name = "video-subtitles-agent"
version = "0.1.0"
description = "基于 whisper-cli + LLM 的视频字幕生成与编辑 Web Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "python-docx>=1.1",
]

[project.scripts]
subtitles-agent = "subtitles_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitles_agent"]
